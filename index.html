<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hennder ERP</title>
  </head>
  <body>
    <!-- Tema antes de o React montar, para nao piscar escuro e clarear (utils/tema.ts). -->
    <script>
      (function () {
        try {
          // Abre CLARO quando a pessoa nunca escolheu (temaDomain.ts, 14/10/2026).
          var p = localStorage.getItem('nexus_theme');
          var escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (p !== 'dark' && !(p === 'auto' && escuro)) document.body.classList.add('light-theme');
        } catch (e) { document.body.classList.add('light-theme'); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
