<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fonte Inter: conexao aberta cedo e CSS que NAO trava a primeira pintura
         (antes era um @import dentro do index.css, que so' comecava depois do
         CSS do app e segurava a tela; Lighthouse 14/10). display=swap mostra o
         texto na fonte do sistema ate' a Inter chegar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" /></noscript>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hennder ERP</title>
  </head>
  <body>
    <!-- Tema antes de o React montar, para nao piscar escuro e clarear (utils/tema.ts). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('nexus_theme');
          var escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (p === 'light' || (p === 'auto' && !escuro)) document.body.classList.add('light-theme');
        } catch (e) { /* sem localStorage: fica escuro */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
